<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NUMA HRIS — Philippine HR System</title>
<meta name="description" content="NUMA HRIS — Human Resource Information System for Philippine MSMEs">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── Reset & Variables ─────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --c-bg:       #F9FAFB;
  --c-surface:  #FFFFFF;
  --c-border:   #E5E7EB;
  --c-text:     #111827;
  --c-muted:    #6B7280;
  --c-primary:  #1D4ED8;
  --c-primary-h:#1E40AF;
  --c-primary-l:#EFF6FF;
  --c-success:  #059669;
  --c-success-l:#D1FAE5;
  --c-warn:     #D97706;
  --c-warn-l:   #FEF3C7;
  --c-danger:   #DC2626;
  --c-danger-l: #FEE2E2;
  --c-yellow:   #FACC15;
  --c-sidebar:  #111827;
  --c-sidebar-t:#F9FAFB;
  --c-sidebar-m:#9CA3AF;
  --c-sidebar-a:#1D4ED8;
  --radius:     10px;
  --shadow:     0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-md:  0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -2px rgba(0,0,0,.1);
  --font:       'Plus Jakarta Sans', system-ui, sans-serif;
  --sidebar-w:  240px;
  --header-h:   60px;
  --transition: .18s ease;
}

html, body { height: 100%; overflow: hidden; font-family: var(--font); background: var(--c-bg); color: var(--c-text); font-size: 14px; line-height: 1.5; }

/* ── Layout ────────────────────────────────────────────── */
#app { display: flex; height: 100vh; overflow: hidden; }

/* ── LOGIN PAGE ─────────────────────────────────────────── */
#login-page {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; width: 100%; background: var(--c-sidebar);
  position: fixed; inset: 0; z-index: 999;
}
.login-card {
  background: var(--c-surface); border-radius: 16px; padding: 40px;
  width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,.3);
  margin: 16px;
}
.login-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; }
.login-logo-icon {
  width: 42px; height: 42px; background: var(--c-primary); border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 800; color: white;
}
.login-logo-text h1 { font-size: 22px; font-weight: 800; color: var(--c-text); letter-spacing: -.5px; }
.login-logo-text p  { font-size: 12px; color: var(--c-muted); }
.login-heading { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
.login-sub     { font-size: 13px; color: var(--c-muted); margin-bottom: 28px; }

/* ── Sidebar ────────────────────────────────────────────── */
#sidebar {
  width: var(--sidebar-w); min-width: var(--sidebar-w);
  background: var(--c-sidebar); color: var(--c-sidebar-t);
  display: flex; flex-direction: column; overflow-y: auto;
  transition: transform var(--transition); z-index: 100;
  scrollbar-width: thin; scrollbar-color: #374151 transparent;
}
.sidebar-header {
  display: flex; align-items: center; gap: 10px;
  padding: 20px 16px 16px; border-bottom: 1px solid #1F2937; flex-shrink: 0;
}
.sidebar-logo {
  width: 36px; height: 36px; background: var(--c-primary); border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 800; color: white; flex-shrink: 0;
}
.sidebar-brand h2 { font-size: 16px; font-weight: 800; letter-spacing: -.3px; }
.sidebar-brand p  { font-size: 10px; color: var(--c-sidebar-m); }
.sidebar-nav { flex: 1; padding: 12px 8px; }
.nav-section-label {
  font-size: 10px; font-weight: 600; color: var(--c-sidebar-m);
  text-transform: uppercase; letter-spacing: .8px;
  padding: 8px 8px 4px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 8px; cursor: pointer;
  color: #D1D5DB; font-size: 13px; font-weight: 500;
  transition: all var(--transition); margin-bottom: 1px;
  white-space: nowrap; border: none; background: none; width: 100%; text-align: left;
}
.nav-item:hover  { background: #1F2937; color: white; }
.nav-item.active { background: var(--c-primary); color: white; font-weight: 600; }
.nav-item svg    { width: 16px; height: 16px; flex-shrink: 0; }
.sidebar-footer  {
  padding: 12px 8px; border-top: 1px solid #1F2937; flex-shrink: 0;
}
.user-card {
  display: flex; align-items: center; gap: 10px;
  padding: 10px; border-radius: 8px; cursor: pointer;
  transition: background var(--transition);
}
.user-card:hover { background: #1F2937; }
.user-avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--c-primary); display: flex; align-items: center;
  justify-content: center; font-size: 13px; font-weight: 700; color: white;
  flex-shrink: 0;
}
.user-info    { flex: 1; min-width: 0; }
.user-name    { font-size: 13px; font-weight: 600; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-email   { font-size: 10px; color: var(--c-sidebar-m); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logout-btn   { background: none; border: none; cursor: pointer; color: var(--c-sidebar-m); padding: 4px; border-radius: 4px; }
.logout-btn:hover { color: var(--c-danger); }

/* ── Main Content ───────────────────────────────────────── */
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
#topbar {
  height: var(--header-h); background: var(--c-surface);
  border-bottom: 1px solid var(--c-border);
  display: flex; align-items: center; padding: 0 24px; gap: 12px;
  flex-shrink: 0; z-index: 50;
}
#page-title { font-size: 17px; font-weight: 700; flex: 1; }
.topbar-badge {
  background: var(--c-primary-l); color: var(--c-primary);
  font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px;
}
#menu-toggle {
  display: none; background: none; border: none; cursor: pointer; padding: 6px; border-radius: 6px;
}
#menu-toggle:hover { background: var(--c-bg); }
#content { flex: 1; overflow-y: auto; padding: 24px; }

/* ── Cards & Components ─────────────────────────────────── */
.card {
  background: var(--c-surface); border: 1px solid var(--c-border);
  border-radius: var(--radius); box-shadow: var(--shadow);
}
.card-header { padding: 20px 20px 0; }
.card-body   { padding: 20px; }
.card-title  { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.card-sub    { font-size: 12px; color: var(--c-muted); }

/* Stat Cards */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card  {
  background: var(--c-surface); border: 1px solid var(--c-border);
  border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow);
}
.stat-label { font-size: 12px; font-weight: 600; color: var(--c-muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
.stat-value { font-size: 28px; font-weight: 800; color: var(--c-text); line-height: 1; margin-bottom: 4px; }
.stat-desc  { font-size: 12px; color: var(--c-muted); }
.stat-icon  { float: right; font-size: 20px; margin-top: -4px; }

/* Table */
.table-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--c-border); }
table       { width: 100%; border-collapse: collapse; background: var(--c-surface); }
thead th    { background: var(--c-bg); font-size: 11px; font-weight: 700; color: var(--c-muted); text-transform: uppercase; letter-spacing: .5px; padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--c-border); }
tbody td    { padding: 12px 16px; border-bottom: 1px solid var(--c-border); font-size: 13px; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--c-bg); }

/* Forms */
.form-grid   { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.form-group  { display: flex; flex-direction: column; gap: 6px; }
.form-label  { font-size: 12px; font-weight: 600; color: var(--c-text); }
.form-input, .form-select, .form-textarea {
  border: 1.5px solid var(--c-border); border-radius: 8px;
  padding: 9px 12px; font-size: 13px; font-family: var(--font);
  color: var(--c-text); background: var(--c-surface); width: 100%;
  transition: border-color var(--transition);
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none; border-color: var(--c-primary); box-shadow: 0 0 0 3px rgba(29,78,216,.1);
}
.form-textarea { resize: vertical; min-height: 80px; }
.form-section-title { font-size: 13px; font-weight: 700; color: var(--c-muted); text-transform: uppercase; letter-spacing: .5px; margin-top: 8px; margin-bottom: 4px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; transition: all var(--transition); font-family: var(--font); text-decoration: none; }
.btn-primary { background: var(--c-primary); color: white; }
.btn-primary:hover { background: var(--c-primary-h); }
.btn-secondary { background: var(--c-bg); color: var(--c-text); border: 1.5px solid var(--c-border); }
.btn-secondary:hover { background: var(--c-border); }
.btn-success { background: var(--c-success); color: white; }
.btn-success:hover { background: #047857; }
.btn-danger { background: var(--c-danger); color: white; }
.btn-danger:hover { background: #B91C1C; }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-icon { padding: 8px; }

/* Badges */
.badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.badge-success { background: var(--c-success-l); color: var(--c-success); }
.badge-warn    { background: var(--c-warn-l);    color: var(--c-warn);    }
.badge-danger  { background: var(--c-danger-l);  color: var(--c-danger);  }
.badge-primary { background: var(--c-primary-l); color: var(--c-primary); }
.badge-neutral { background: var(--c-bg);        color: var(--c-muted); border: 1px solid var(--c-border); }

/* Pill tags */
.role-tag { display: inline-flex; align-items: center; background: #1F2937; color: #E5E7EB; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 4px; margin: 2px; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 500; display: flex; align-items: center; justify-content: center; padding: 16px; backdrop-filter: blur(4px); }
.modal         { background: var(--c-surface); border-radius: 16px; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
.modal-header  { padding: 20px 20px 0; display: flex; justify-content: space-between; align-items: flex-start; }
.modal-title   { font-size: 17px; font-weight: 700; }
.modal-close   { background: none; border: none; cursor: pointer; color: var(--c-muted); font-size: 18px; padding: 4px; border-radius: 6px; }
.modal-close:hover { background: var(--c-bg); color: var(--c-text); }
.modal-body    { padding: 20px; }
.modal-footer  { padding: 0 20px 20px; display: flex; gap: 10px; justify-content: flex-end; }

/* Toast */
#toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
.toast { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 10px; background: var(--c-text); color: white; font-size: 13px; font-weight: 500; box-shadow: var(--shadow-md); animation: slide-in .2s ease; max-width: 320px; }
.toast.success { background: var(--c-success); }
.toast.error   { background: var(--c-danger); }
.toast.warn    { background: var(--c-warn); }
@keyframes slide-in { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* Search bar */
.search-bar { display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--c-border); border-radius: 8px; padding: 0 12px; background: var(--c-surface); }
.search-bar input { border: none; outline: none; font-size: 13px; color: var(--c-text); padding: 9px 0; flex: 1; font-family: var(--font); background: transparent; }
.search-bar svg   { color: var(--c-muted); width: 15px; height: 15px; }

/* Page header */
.page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 24px; gap: 12px; flex-wrap: wrap; }
.page-header-left h2 { font-size: 22px; font-weight: 800; letter-spacing: -.5px; }
.page-header-left p  { font-size: 13px; color: var(--c-muted); margin-top: 2px; }
.page-header-right   { display: flex; gap: 8px; flex-wrap: wrap; }

/* Empty state */
.empty-state { text-align: center; padding: 48px 24px; color: var(--c-muted); }
.empty-state svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: .4; }
.empty-state h3  { font-size: 15px; font-weight: 600; color: var(--c-text); margin-bottom: 6px; }
.empty-state p   { font-size: 13px; }

/* Info rows (profile display) */
.info-row { display: flex; gap: 24px; padding: 14px 0; border-bottom: 1px solid var(--c-border); flex-wrap: wrap; }
.info-row:last-child { border-bottom: none; }
.info-label { width: 180px; font-size: 12px; font-weight: 600; color: var(--c-muted); flex-shrink: 0; padding-top: 2px; }
.info-value { flex: 1; font-size: 13px; color: var(--c-text); }

/* Payslip */
.payslip-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--c-border); font-size: 13px; }
.payslip-row:last-child { border-bottom: none; }
.payslip-total { font-weight: 700; font-size: 15px; background: var(--c-bg); border-radius: 8px; padding: 12px 16px; margin-top: 8px; display: flex; justify-content: space-between; }
.payslip-net   { font-size: 18px; font-weight: 800; color: var(--c-primary); }

/* Mobile overlay */
#sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 99; }

/* Clock card */
.clock-card { background: linear-gradient(135deg, var(--c-primary), #1E40AF); color: white; border-radius: var(--radius); padding: 24px; margin-bottom: 24px; }
.clock-time { font-size: 36px; font-weight: 800; letter-spacing: -1px; }
.clock-date { font-size: 14px; opacity: .8; margin-top: 4px; }
.clock-actions { display: flex; gap: 10px; margin-top: 16px; }
.btn-light { background: rgba(255,255,255,.15); color: white; border: 1.5px solid rgba(255,255,255,.3); }
.btn-light:hover { background: rgba(255,255,255,.25); }

/* Quick actions grid */
.quick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
.quick-item { background: var(--c-surface); border: 1.5px solid var(--c-border); border-radius: var(--radius); padding: 16px; text-align: center; cursor: pointer; transition: all var(--transition); }
.quick-item:hover { border-color: var(--c-primary); background: var(--c-primary-l); }
.quick-item:hover .quick-label { color: var(--c-primary); }
.quick-icon  { font-size: 24px; margin-bottom: 8px; }
.quick-label { font-size: 12px; font-weight: 600; color: var(--c-text); }

/* Tabs */
.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--c-border); margin-bottom: 24px; overflow-x: auto; }
.tab  { padding: 10px 16px; font-size: 13px; font-weight: 600; color: var(--c-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; white-space: nowrap; transition: all var(--transition); background: none; border-top: none; border-left: none; border-right: none; font-family: var(--font); }
.tab.active { color: var(--c-primary); border-bottom-color: var(--c-primary); }
.tab:hover  { color: var(--c-text); }

/* Alerts */
.alert { border-radius: var(--radius); padding: 14px 16px; font-size: 13px; display: flex; gap: 10px; align-items: flex-start; }
.alert-info    { background: var(--c-primary-l); color: var(--c-primary); border: 1px solid #BFDBFE; }
.alert-success { background: var(--c-success-l); color: var(--c-success); border: 1px solid #A7F3D0; }

/* Loading spinner */
.spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid rgba(29,78,216,.2); border-top-color: var(--c-primary); border-radius: 50%; animation: spin .6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-state { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 40px; color: var(--c-muted); font-size: 13px; }

/* ── Responsive ─────────────────────────────────────────── */
@media (max-width: 768px) {
  #sidebar { position: fixed; left: 0; top: 0; height: 100vh; transform: translateX(-100%); }
  #sidebar.open { transform: translateX(0); }
  #sidebar-overlay.show { display: block; }
  #menu-toggle { display: flex; }
  #content { padding: 16px; }
  .form-grid { grid-template-columns: 1fr; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .page-header { flex-direction: column; }
  .modal { max-width: 100%; margin: 0; border-radius: 16px 16px 0 0; position: fixed; bottom: 0; left: 0; right: 0; max-height: 95vh; }
  .modal-overlay { align-items: flex-end; padding: 0; }
  #toast-container { bottom: 80px; right: 12px; left: 12px; }
}
</style>
</head>
<body>

<!-- ── TOAST CONTAINER ───────────────────────────────────── -->
<div id="toast-container"></div>

<!-- ── LOGIN PAGE ───────────────────────────────────────── -->
<div id="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">N</div>
      <div class="login-logo-text">
        <h1>NUMA HRIS</h1>
        <p>Philippine HR System</p>
      </div>
    </div>
    <h2 class="login-heading">Welcome back</h2>
    <p class="login-sub">Sign in with your company account</p>
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input id="login-email" type="email" class="form-input" placeholder="you@company.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input id="login-password" type="password" class="form-input" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button id="login-btn" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;">
        Sign In
      </button>
      <div id="login-error" style="color:var(--c-danger);font-size:12px;text-align:center;display:none;"></div>
    </div>
    <p style="margin-top:20px;font-size:11px;color:var(--c-muted);text-align:center;">
      NUMA HRIS v2.0 — Built for Philippine MSMEs
    </p>
  </div>
</div>

<!-- ── MAIN APP ──────────────────────────────────────────── -->
<div id="app" style="display:none;">
  <div id="sidebar-overlay"></div>

  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">N</div>
      <div class="sidebar-brand">
        <h2>NUMA HRIS</h2>
        <p id="company-name-sidebar">Your Company</p>
      </div>
    </div>

    <nav class="sidebar-nav" id="sidebar-nav">
      <!-- Generated by JS based on role -->
    </nav>

    <div class="sidebar-footer">
      <div class="user-card" id="user-card-btn">
        <div class="user-avatar" id="sidebar-avatar">?</div>
        <div class="user-info">
          <div class="user-name"  id="sidebar-name">Loading...</div>
          <div class="user-email" id="sidebar-email">...</div>
        </div>
        <button class="logout-btn" id="logout-btn" title="Sign out">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" width="16" height="16"><path fill-rule="evenodd" d="M3 4.25A2.25 2.25 0 015.25 2h5.5A2.25 2.25 0 0113 4.25v2a.75.75 0 01-1.5 0v-2a.75.75 0 00-.75-.75h-5.5a.75.75 0 00-.75.75v11.5c0 .414.336.75.75.75h5.5a.75.75 0 00.75-.75v-2a.75.75 0 011.5 0v2A2.25 2.25 0 0110.75 18h-5.5A2.25 2.25 0 013 15.75V4.25z" clip-rule="evenodd"/><path fill-rule="evenodd" d="M6 10a.75.75 0 01.75-.75h9.546l-1.048-.943a.75.75 0 111.004-1.114l2.5 2.25a.75.75 0 010 1.114l-2.5 2.25a.75.75 0 11-1.004-1.114l1.048-.943H6.75A.75.75 0 016 10z" clip-rule="evenodd"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div id="main">
    <header id="topbar">
      <button id="menu-toggle" aria-label="Toggle menu">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <span id="page-title">Dashboard</span>
      <span class="topbar-badge" id="role-badge">Employee</span>
      <div id="topbar-clock" style="font-size:12px;color:var(--c-muted);"></div>
    </header>
    <main id="content">
      <div class="loading-state"><div class="spinner"></div> Loading...</div>
    </main>
  </div>
</div>

<!-- ── MODAL TEMPLATE ────────────────────────────────────── -->
<div id="modal-overlay" class="modal-overlay" style="display:none;">
  <div class="modal" id="modal-box">
    <div class="modal-header">
      <h3 class="modal-title" id="modal-title">Modal</h3>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════
   NUMA HRIS — Frontend Application
   Connects to your Node.js/Express backend
   ══════════════════════════════════════════════════════════ */

// ── CONFIG — Update API_BASE to your deployed backend URL ──
const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
  ? 'http://localhost:3001'
  : 'https://YOUR-BACKEND.up.railway.app';  // ← Change this after deploying!

// ── State ──────────────────────────────────────────────────
let STATE = { user: null, token: null, currentPage: 'dashboard' };

// ── API Helper ─────────────────────────────────────────────
async function api(method, path, body) {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json' },
  };
  if (STATE.token) opts.headers['Authorization'] = `Bearer ${STATE.token}`;
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(`${API_BASE}${path}`, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.message || 'Request failed');
  return data;
}

// ── Auth ───────────────────────────────────────────────────
async function login() {
  const email    = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const btn      = document.getElementById('login-btn');
  const errEl    = document.getElementById('login-error');

  if (!email || !password) { errEl.textContent = 'Please enter email and password'; errEl.style.display = 'block'; return; }

  btn.textContent = 'Signing in…'; btn.disabled = true;
  errEl.style.display = 'none';

  try {
    const data = await api('POST', '/api/auth/login', { email, password });
    STATE.token = data.token;
    STATE.user  = data.user;
    localStorage.setItem('numa_token', data.token);
    localStorage.setItem('numa_user',  JSON.stringify(data.user));
    showApp();
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
  } finally {
    btn.textContent = 'Sign In'; btn.disabled = false;
  }
}

function logout() {
  STATE.token = null; STATE.user = null;
  localStorage.removeItem('numa_token');
  localStorage.removeItem('numa_user');
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-page').style.display = 'flex';
}

// ── App Bootstrap ──────────────────────────────────────────
function showApp() {
  document.getElementById('login-page').style.display = 'none';
  document.getElementById('app').style.display = 'flex';

  const u = STATE.user;
  const initials = (u.full_name || 'U').split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
  document.getElementById('sidebar-avatar').textContent = initials;
  document.getElementById('sidebar-name').textContent   = u.full_name || u.email;
  document.getElementById('sidebar-email').textContent  = u.email;

  const primaryRole = getPrimaryRole();
  document.getElementById('role-badge').textContent = ROLE_LABELS[primaryRole] || 'Employee';

  buildNav();
  navigate('dashboard');
  startClock();
}

function hasRole(...roles) {
  const userRoles = STATE.user?.roles || [];
  return roles.some(r => userRoles.includes(r));
}
function getPrimaryRole() {
  if (hasRole('admin'))      return 'admin';
  if (hasRole('hr','hr_manager','payroll_officer')) return 'hr';
  if (hasRole('manager','supervisor')) return 'manager';
  return 'employee';
}

const ROLE_LABELS = { admin:'Admin', hr:'HR Manager', manager:'Supervisor', employee:'Employee' };

// ── Navigation Map ─────────────────────────────────────────
const NAV_SECTIONS = [
  {
    label: 'My Space',
    items: [
      { id:'dashboard',   label:'Dashboard',      icon:'🏠', roles:['*'] },
      { id:'my-profile',  label:'My Profile',     icon:'👤', roles:['*'] },
      { id:'my-payslips', label:'Pay Slips',       icon:'💰', roles:['*'] },
      { id:'attendance',  label:'Attendance',      icon:'🕐', roles:['*'] },
      { id:'my-leave',    label:'Leave Requests',  icon:'📅', roles:['*'] },
    ]
  },
  {
    label: 'Team',
    roles: ['manager','supervisor'],
    items: [
      { id:'leave-approvals', label:'Leave Approvals', icon:'✅', roles:['manager','supervisor','hr','admin'] },
    ]
  },
  {
    label: 'HR Management',
    roles: ['hr','admin','hr_manager'],
    items: [
      { id:'employees',   label:'Employee Records', icon:'👥', roles:['hr','admin','hr_manager'] },
      { id:'payroll',     label:'Payroll',          icon:'📊', roles:['hr','admin','hr_manager','payroll_officer'] },
      { id:'hr-leave',    label:'Leave Management', icon:'📋', roles:['hr','admin','hr_manager'] },
      { id:'hr-attendance',label:'Attendance Mgmt', icon:'⏱️', roles:['hr','admin','hr_manager'] },
    ]
  },
  {
    label: 'Administration',
    roles: ['admin'],
    items: [
      { id:'user-accounts', label:'User Accounts', icon:'🔑', roles:['admin','hr_manager'] },
      { id:'activity-logs', label:'Activity Logs', icon:'📝', roles:['admin'] },
    ]
  }
];

function buildNav() {
  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = '';
  NAV_SECTIONS.forEach(section => {
    const visibleItems = section.items.filter(item =>
      item.roles.includes('*') || item.roles.some(r => (STATE.user?.roles||[]).includes(r))
    );
    if (visibleItems.length === 0) return;
    const sectionEl = document.createElement('div');
    sectionEl.innerHTML = `<div class="nav-section-label">${section.label}</div>`;
    visibleItems.forEach(item => {
      const btn = document.createElement('button');
      btn.className = 'nav-item';
      btn.dataset.page = item.id;
      btn.innerHTML = `<span style="font-size:14px;">${item.icon}</span> ${item.label}`;
      btn.addEventListener('click', () => { navigate(item.id); closeSidebar(); });
      sectionEl.appendChild(btn);
    });
    nav.appendChild(sectionEl);
  });
}

function navigate(page) {
  STATE.currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });
  const titles = {
    'dashboard':'Dashboard','my-profile':'My Profile','my-payslips':'Pay Slips',
    'attendance':'Attendance','my-leave':'Leave Requests','leave-approvals':'Leave Approvals',
    'employees':'Employee Records','payroll':'Payroll Processing',
    'hr-leave':'Leave Management','hr-attendance':'Attendance Management',
    'user-accounts':'User Accounts','activity-logs':'Activity Logs'
  };
  document.getElementById('page-title').textContent = titles[page] || page;
  renderPage(page);
}

// ── Clock ──────────────────────────────────────────────────
function startClock() {
  const el = document.getElementById('topbar-clock');
  const tick = () => {
    const now = new Date();
    el.textContent = now.toLocaleTimeString('en-PH', { hour:'2-digit', minute:'2-digit' });
  };
  tick(); setInterval(tick, 1000);
}

// ── Formatters ─────────────────────────────────────────────
const fmt = {
  peso:  n => `₱${(+n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2})}`,
  date:  d => d ? new Date(d).toLocaleDateString('en-PH',{year:'numeric',month:'short',day:'numeric'}) : '—',
  badge: (status, map) => {
    const cls = map?.[status] || 'badge-neutral';
    return `<span class="badge ${cls}">${status||'—'}</span>`;
  }
};
const STATUS_BADGE = { active:'badge-success', inactive:'badge-danger', pending:'badge-warn', approved:'badge-success', rejected:'badge-danger', present:'badge-success', absent:'badge-danger' };

// ═══════════════════════════════════════════════════════════
// PAGES
// ═══════════════════════════════════════════════════════════
async function renderPage(page) {
  const content = document.getElementById('content');
  content.innerHTML = `<div class="loading-state"><div class="spinner"></div> Loading...</div>`;
  try {
    switch(page) {
      case 'dashboard':       await renderDashboard(content); break;
      case 'my-profile':      await renderMyProfile(content); break;
      case 'my-payslips':     await renderMyPayslips(content); break;
      case 'attendance':      await renderMyAttendance(content); break;
      case 'my-leave':        await renderMyLeave(content); break;
      case 'leave-approvals': await renderLeaveApprovals(content); break;
      case 'employees':       await renderEmployees(content); break;
      case 'payroll':         await renderPayroll(content); break;
      case 'hr-leave':        await renderHrLeave(content); break;
      case 'hr-attendance':   await renderHrAttendance(content); break;
      case 'user-accounts':   await renderUserAccounts(content); break;
      case 'activity-logs':   await renderActivityLogs(content); break;
      default: content.innerHTML = `<p>Page not found</p>`;
    }
  } catch(err) {
    content.innerHTML = `
      <div class="card card-body" style="color:var(--c-danger);">
        <strong>Failed to load page</strong><br>
        <small>${err.message}</small><br><br>
        <small>Make sure your backend is running at <code>${API_BASE}</code></small>
      </div>`;
  }
}

// ── DASHBOARD ──────────────────────────────────────────────
async function renderDashboard(el) {
  const isHR = hasRole('hr','admin','hr_manager','payroll_officer');
  const today = new Date();
  const dateStr = today.toLocaleDateString('en-PH',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

        <div class="stat-card"><div class="stat-label">Total Employees</div><div class="stat-value">${summary.total_employees}</div><div class="stat-desc">Active in system</div></div>
        <div class="stat-card"><div class="stat-label">Present Today</div><div class="stat-value" style="color:var(--c-success)">${summary.present_today}</div><div class="stat-desc">Clocked in</div></div>
        <div class="stat-card"><div class="stat-label">Pending Leaves</div><div class="stat-value" style="color:var(--c-warn)">${summary.pending_leaves}</div><div class="stat-desc">Awaiting approval</div></div>
        <div class="stat-card"><div class="stat-label">Last Payroll</div><div class="stat-value" style="font-size:16px;">${summary.last_payroll ? fmt.badge(summary.last_payroll.status, {'completed':'badge-success','draft':'badge-neutral'}) : '—'}</div><div class="stat-desc">${summary.last_payroll ? fmt.date(summary.last_payroll.period_end) : 'No payroll run yet'}</div></div>

    }
  }

  el.innerHTML = `
    <div class="clock-card">
      <div class="clock-time" id="dash-clock">${today.toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit'})}</div>
      <div class="clock-date">${dateStr}</div>
      <div class="clock-actions">
        <button class="btn btn-light" onclick="clockIn()">⏵ Clock In</button>
        <button class="btn btn-light" onclick="clockOut()">⏹ Clock Out</button>
      </div>
    </div>
    ${statsHtml}
    <div>
      <h3 style="font-size:14px;font-weight:700;margin-bottom:12px;color:var(--c-muted);">QUICK ACTIONS</h3>
      <div class="quick-grid">
        <div class="quick-item" onclick="navigate('my-profile')"><div class="quick-icon">👤</div><div class="quick-label">My Profile</div></div>
        <div class="quick-item" onclick="navigate('my-payslips')"><div class="quick-icon">💰</div><div class="quick-label">Pay Slips</div></div>
        <div class="quick-item" onclick="navigate('attendance')"><div class="quick-icon">🕐</div><div class="quick-label">Attendance</div></div>
        <div class="quick-item" onclick="navigate('my-leave')"><div class="quick-icon">📅</div><div class="quick-label">File Leave</div></div>
        ${isHR ? `
        <div class="quick-item" onclick="navigate('employees')"><div class="quick-icon">👥</div><div class="quick-label">Employees</div></div>
        <div class="quick-item" onclick="navigate('payroll')"><div class="quick-icon">📊</div><div class="quick-label">Payroll</div></div>
        ` : ''}
      </div>
    </div>`;

  // Live clock on dashboard
  setInterval(() => {
    const el = document.getElementById('dash-clock');
    if (el) el.textContent = new Date().toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit'});
  }, 1000);
}

async function clockIn() {
  try {
    await api('POST', '/api/attendance/clock-in');
    toast('Clocked in successfully!', 'success');
  } catch(err) { toast(err.message, 'error'); }
}

  try {
    await api('PUT', '/api/attendance/clock-out');
    toast('Clocked out successfully!', 'success');
  } catch(err) { toast(err.message, 'error'); }
}

async function approveLeave(id) {
  try {
    await api('PUT', `/api/leave/${id}/approve`, { remarks:'Approved' });
    toast('Leave approved', 'success'); renderPage('leave-approvals');
  } catch(e) { toast(e.message,'error'); }
}
async function rejectLeave(id) {
  const remarks = prompt('Reason for rejection:');
  if (remarks === null) return;
  try {
    await api('PUT', `/api/leave/${id}/reject`, { remarks });
    toast('Leave rejected', 'success'); renderPage('leave-approvals');
  } catch(e) { toast(e.message,'error'); }
}

        <option value="true" ${u.is_active?'selected':''}>Active</option>
        <option value="false" ${!u.is_active?'selected':''}>Deactivated</option>
      </select>
    </div>`,
    [{ label:'Save Changes', cls:'btn-primary', action: async () => {
      const roles = document.getElementById('eu-roles').value.split(',').map(r=>r.trim()).filter(Boolean);
      await api('PUT', `/api/users/${u.id}`, {
        full_name: document.getElementById('eu-name').value,
        roles, is_active: document.getElementById('eu-active').value === 'true'
      });
      closeModal(); toast('User updated','success'); renderPage('user-accounts');
    }}]
  );
}

// ── HR LEAVE MANAGE (full list) ────────────────────────────
async function renderHrLeave(el) {
  const { leave_requests } = await api('GET', '/api/leave');

  let rows = leave_requests.map(l => `
    <tr>
      <td>${l.employee ? `${l.employee.first_name} ${l.employee.last_name}` : '—'}</td>
      <td>${l.leave_type}</td>
      <td>${fmt.date(l.start_date)} – ${fmt.date(l.end_date)}</td>
      <td>${l.days_count}</td>
      <td>${fmt.badge(l.status, STATUS_BADGE)}</td>
      <td>
        ${l.status === 'pending' ? `
          <button class="btn btn-sm btn-success" onclick="approveLeave('${l.id}')">Approve</button>
          <button class="btn btn-sm btn-danger" style="margin-left:4px;" onclick="rejectLeave('${l.id}')">Reject</button>
        ` : (l.remarks||'—')}
      </td>
    </tr>`).join('');

  el.innerHTML = `
    <div class="page-header"><div class="page-header-left"><h2>Leave Management</h2></div></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Employee</th><th>Type</th><th>Date Range</th><th>Days</th><th>Status</th><th>Action</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--c-muted);">No leave requests</td></tr>'}</tbody>
    </table></div>`;
}

// ═══════════════════════════════════════════════════════════
// MODAL SYSTEM
// ═══════════════════════════════════════════════════════════
function openModal(title, bodyHtml, buttons = []) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML    = bodyHtml;

  const footer = document.getElementById('modal-footer');
  footer.innerHTML = `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>`;
  buttons.forEach(btn => {
    const b = document.createElement('button');
    b.className = `btn ${btn.cls||'btn-primary'}`;
    b.textContent = btn.label;
    b.onclick = async () => {
      b.disabled = true; b.textContent = 'Saving…';
      try { await btn.action(); } catch(e) { toast(e.message,'error'); b.disabled=false; b.textContent=btn.label; }
      if (!btn.noClose) { /* closeModal handled in action */ }
    };
    footer.appendChild(b);
  });

  document.getElementById('modal-overlay').style.display = 'flex';
}
function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }

// ═══════════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════════
function toast(msg, type = 'info') {
  const icons = { success:'✓', error:'✕', warn:'⚠', info:'ℹ' };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = `${icons[type]||''} ${msg}`;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

(function init() {
  const token = localStorage.getItem('numa_token');

  if (token && user) {

    STATE.user  = JSON.parse(user);

})();
